        if(data.recovery&&data.recovery.firstHalfAvg!=null&&data.recovery.secondHalfAvg!=null){const diff=data.recovery.secondHalfAvg-data.recovery.firstHalfAvg;recInsights.push(['freshness',Math.abs(diff)<8?'freshness stayed fairly steady through the week.':`freshness moved ${Math.abs(diff)} points ${diff>0?'up':'down'} from the first half of the week to the second.`]);}
        if(data.sleepDebt)recInsights.push(['sleep debt',`${data.sleepDebt.hours.toFixed(1)}h rolling debt across ${data.sleepDebt.daysWithData} logged nights.`]);
        if(data.sleepConsistency)recInsights.push(['sleep timing',`consistency ${data.sleepConsistency.score}/100; average timing swing about ${Math.round(data.sleepConsistency.avgStdDevMinutes)} min.`]);
        if(recInsights.length)html+=`<div class="retro-insight-list">${recInsights.map(([k,t])=>`<div class="retro-insight"><div class="retro-insight-key">${k}</div><div class="retro-insight-text">${t}</div></div>`).join('')}</div>`;
        html+=`</div>`;
        if(data.checkInsThisWeek.length)html+=`<div class="retro-section"><div class="retro-section-title">goal check-ins</div><div class="retro-checkins">${data.checkInsThisWeek.map(ci=>`<span class="retro-checkin-chip status-${ci.status.replace(/\s+/g,'-')}">${ci.goal} · ${ci.status}</span>`).join('')}</div></div>`;
        content.innerHTML=html;
        document.getElementById('retroOverlay').classList.add('open');
      }
      function closeWeeklyRetro(){document.getElementById('retroOverlay').classList.remove('open');}
      function checkWeeklyRecap(){
        const currentWeek=getISOWeekId(new Date());
        if(lastRecapWeek===currentWeek)return;
        if(lastRecapWeek!==null){
          const today=new Date();const dow=today.getDay();const monOffset=dow===0?6:dow-1;
          const thisMonday=new Date(today);thisMonday.setDate(thisMonday.getDate()-monOffset);
          const lastMonday=new Date(thisMonday);lastMonday.setDate(lastMonday.getDate()-7);
          let totalMin=0,totalSessions=0;
          for(let i=0;i<7;i++){const d=new Date(lastMonday);d.setDate(d.getDate()+i);const ds=toDateStr(d);const rec=dailyHistory[ds];if(rec){totalMin+=rec.focusMinutes||0;totalSessions+=rec.sessions||0;}}
          if(totalMin>0||totalSessions>0){const data=generateWeeklyRetroData(lastMonday,new Date(lastMonday.getTime()+6*86400000));openWeeklyRetro(data);}
          if(adaptiveGoalEnabled){
            const lastMondayStr=toDateStr(lastMonday);
            const lastSunday=new Date(lastMonday);lastSunday.setDate(lastSunday.getDate()+6);
            const lastSundayStr=toDateStr(lastSunday);
            const lastWeekCompleted=tasks.filter(t=>t.completed&&t.completedAt&&t.completedAt>=lastMondayStr&&t.completedAt<=lastSundayStr).length;
            const newGoal=Math.max(1,lastWeekCompleted+1);
            if(newGoal!==taskWeeklyGoal){
              taskWeeklyGoal=newGoal;
              renderTodayGoal();
              showToast(`weekly goal adjusted to ${newGoal} — you completed ${lastWeekCompleted} last week`);
            }
          }
        }
        lastRecapWeek=currentWeek;saveData();
      }
      let firebaseLoadFailed=false;
      function onFirebaseReady(cb){
        if(window.fb){cb();return;}
        if(firebaseLoadFailed){showToast('⚠ cloud sync unavailable — check your connection and reload');return;}
        const timeout=setTimeout(()=>{if(!window.fb){firebaseLoadFailed=true;showToast('⚠ cloud sync failed to load — check your connection and reload the page');}},5000);
        window.addEventListener('firebase-ready',()=>{clearTimeout(timeout);cb();},{once:true});
        window.addEventListener('firebase-failed',()=>{clearTimeout(timeout);firebaseLoadFailed=true;showToast('⚠ cloud sync unavailable — check your connection');},{once:true});
      }
      function describeAuthError(err){
        const code=(err&&err.code)||'';
        if(code.includes('email-already-in-use'))return'that email is already registered — try signing in instead';
        if(code.includes('invalid-email'))return'that email looks invalid';
        if(code.includes('weak-password'))return'password should be at least 6 characters';
        if(code.includes('user-not-found')||code.includes('wrong-password')||code.includes('invalid-credential'))return'email or password is incorrect';
        if(code.includes('network-request-failed'))return'network error — check your connection';
        if(code.includes('too-many-requests'))return'too many attempts — wait a bit and try again';
        if(code.includes('operation-not-allowed'))return'email/password sign-in isn\'t enabled for this project yet — check Firebase Console → Authentication → Sign-in method';
        if(code.includes('admin-restricted-operation'))return'sign-in isn\'t enabled for this project yet — check Firebase Console → Authentication → Sign-in method';
        return code?`something went wrong (${code})`:'something went wrong — try again';
      }
      function updateSyncStatusDot(status){
        const dot=document.getElementById('syncStatusDot');
        if(!dot)return;
        dot.classList.remove('synced','syncing','error');
        if(status==='offline'){dot.title='cloud sync: not signed in';}
        else{
          dot.classList.add(status);
          dot.title=status==='synced'?'cloud sync: up to date':status==='syncing'?'cloud sync: syncing…':'cloud sync: error — will retry on next change';
        }
      }
      function updateSyncUI(){
        const signedOutView=document.getElementById('syncSignedOutView'),signedInView=document.getElementById('syncSignedInView'),statusText=document.getElementById('syncStatusText');
        if(!signedOutView||!signedInView||!statusText)return;
        if(syncUser){
          signedOutView.style.display='none';signedInView.style.display='block';
          document.getElementById('syncEmailDisplay').textContent=`signed in as ${syncUser.email}`;
          statusText.textContent='synced across your devices';
        }else{
          signedOutView.style.display='block';signedInView.style.display='none';
          statusText.textContent='not signed in — your data stays on this device only';
        }
        updateSyncStatusDot(syncUser?'synced':'offline');
      }
      function saveRememberedEmail(email){try{localStorage.setItem('pomodoro-sync-email',email);}catch(e){}}
      function loadRememberedEmail(){try{return localStorage.getItem('pomodoro-sync-email')||'';}catch(e){return'';}}
      function handleSyncSignUp(){
        const email=document.getElementById('syncEmailInput').value.trim(),pw=document.getElementById('syncPasswordInput').value;
        if(!email||!pw){showToast('enter an email and password');return;}
        onFirebaseReady(()=>{window.fb.createUserWithEmailAndPassword(window.fb.auth,email,pw).then(()=>{saveRememberedEmail(email);showToast('account created — signing in...');}).catch(err=>showToast('⚠ '+describeAuthError(err)));});
      }
      function handleSyncSignIn(){
        const email=document.getElementById('syncEmailInput').value.trim(),pw=document.getElementById('syncPasswordInput').value;
        if(!email||!pw){showToast('enter an email and password');return;}
        onFirebaseReady(()=>{window.fb.signInWithEmailAndPassword(window.fb.auth,email,pw).then(credential=>{saveRememberedEmail(email);applyAuthenticatedUser(credential.user||window.fb.auth.currentUser);showToast('signed in');}).catch(err=>showToast('⚠ '+describeAuthError(err)));});
      }
      function handleSyncSignOut(){onFirebaseReady(()=>{window.fb.signOut(window.fb.auth).then(()=>showToast('signed out — data stays local now'));});}
      function toggleChangePasswordForm(){
        const form=document.getElementById('syncChangePasswordForm');
        const showing=form.style.display!=='none';
        form.style.display=showing?'none':'block';
        document.getElementById('syncCurrentPasswordInput').value='';
        document.getElementById('syncNewPasswordInput').value='';
      }
      function handleChangePassword(){
        const currentPw=document.getElementById('syncCurrentPasswordInput').value;
        const newPw=document.getElementById('syncNewPasswordInput').value;
        if(!currentPw||!newPw){showToast('enter your current and new password');return;}
        if(newPw.length<6){showToast('new password should be at least 6 characters');return;}
        onFirebaseReady(()=>{
          const user=window.fb.auth.currentUser;
          if(!user){showToast('⚠ not signed in');return;}
          const credential=firebase.auth.EmailAuthProvider.credential(user.email,currentPw);
          user.reauthenticateWithCredential(credential).then(()=>user.updatePassword(newPw)).then(()=>{
            showToast('✓ password updated');
            saveRememberedEmail(user.email);
            toggleChangePasswordForm();
          }).catch(err=>showToast('⚠ '+describeAuthError(err)));
        });
      }
      function handleSyncForgotPassword(){
        const email=document.getElementById('syncEmailInput').value.trim();
        if(!email){showToast('enter your email first, then tap this again');return;}
        onFirebaseReady(()=>{window.fb.sendPasswordResetEmail(window.fb.auth,email).then(()=>showToast('password reset email sent')).catch(err=>showToast('⚠ '+describeAuthError(err)));});
      }
      function hasLocalData(){return tasks.length>0||bgHabits.length>0||totalFocusMinutes>0||Object.keys(dailyHistory).length>0;}
      function applyCloudState(remoteState){
        isApplyingRemoteUpdate=true;
        loadData(remoteState);
        refreshAllUI();
        try{localStorage.setItem('pomodoro-cyberspace-data',JSON.stringify(buildStateSnapshot()));}catch(e){}
        isApplyingRemoteUpdate=false;
        updateSyncStatusDot('synced');
      }
      function promptSyncConflict(remoteState){pendingConflictRemoteState=remoteState;document.getElementById('syncConflictOverlay').classList.add('open');}
      function resolveSyncConflictCloud(){document.getElementById('syncConflictOverlay').classList.remove('open');if(pendingConflictRemoteState)applyCloudState(pendingConflictRemoteState);pendingConflictRemoteState=null;showToast('using your cloud data');checkWeeklyRecap();}
      function resolveSyncConflictLocal(){document.getElementById('syncConflictOverlay').classList.remove('open');pendingConflictRemoteState=null;pushToCloud();showToast("kept this device's data — pushed to cloud");checkWeeklyRecap();}
      function resolveSyncConflictCancel(){document.getElementById('syncConflictOverlay').classList.remove('open');pendingConflictRemoteState=null;handleSyncSignOut();checkWeeklyRecap();}
      let lastPushedStateJSON=null;
      let hasUnsyncedLocalChanges=false;
      function pushToCloud(){
        if(!syncUser)return;
        updateSyncStatusDot('syncing');
        onFirebaseReady(()=>{
          const state=buildStateSnapshot();
          const stateJSON=JSON.stringify(state);
          const ref=window.fb.doc(window.fb.db,'userStates',syncUser.uid);
          window.fb.setDoc(ref,{state,updatedAt:window.fb.serverTimestamp(),schemaVersion:SYNC_SCHEMA_VERSION},{merge:true}).then(()=>{lastPushedStateJSON=stateJSON;const currentJSON=JSON.stringify(buildStateSnapshot());hasUnsyncedLocalChanges=currentJSON!==stateJSON;if(hasUnsyncedLocalChanges)scheduleCloudPush();else updateSyncStatusDot('synced');}).catch(err=>{hasUnsyncedLocalChanges=true;console.error(err);showToast('⚠ cloud sync failed — will retry on next change');updateSyncStatusDot('error');});
        });
      }
      function scheduleCloudPush(){
        if(!syncUser||isApplyingRemoteUpdate)return;
        hasUnsyncedLocalChanges=true;
        updateSyncStatusDot('syncing');
        if(pendingCloudPushTimeout)clearTimeout(pendingCloudPushTimeout);
        pendingCloudPushTimeout=setTimeout(()=>{pushToCloud();},2500);
      }
      function flushPendingCloudPush(){
        if(pendingCloudPushTimeout){
          clearTimeout(pendingCloudPushTimeout);
          pendingCloudPushTimeout=null;
          pushToCloud();
        }
      }
      document.addEventListener('visibilitychange',()=>{if(document.hidden)flushPendingCloudPush();});
      window.addEventListener('pagehide',()=>{saveData();flushPendingCloudPush();});
      window.addEventListener('beforeunload',flushPendingCloudPush);
      function attachRealtimeListener(uid){
        onFirebaseReady(()=>{
          const ref=window.fb.doc(window.fb.db,'userStates',uid);
          syncUnsubscribe=window.fb.onSnapshot(ref,(snap)=>{
            if(snap.metadata&&snap.metadata.hasPendingWrites)return;
            if(!snap.exists)return;
            if(isApplyingRemoteUpdate)return;
            if(hasUnsyncedLocalChanges)return;
            const remote=snap.data();
            const remoteState=remote.state||{};
            if(lastPushedStateJSON!==null&&JSON.stringify(remoteState)===lastPushedStateJSON)return;
            applyCloudState(remoteState);
          },(err)=>{console.error(err);});
        });
      }
      function stopCloudListener(){if(syncUnsubscribe){syncUnsubscribe();syncUnsubscribe=null;}}
      function applyAuthenticatedUser(user){
        const sameUser=!!(user&&syncUser&&user.uid===syncUser.uid);
        syncUser=user||null;
        updateSyncUI();
        if(syncUser){if(!sameUser||!syncUnsubscribe)startCloudSync(syncUser.uid);}
        else{stopCloudListener();checkWeeklyRecap();}
      }
      function startCloudSync(uid){
        stopCloudListener();
        updateSyncStatusDot('syncing');
        onFirebaseReady(()=>{
          const ref=window.fb.doc(window.fb.db,'userStates',uid);
          window.fb.getDoc(ref).then(snap=>{
            if(snap.exists){
              const remote=snap.data(),remoteState=remote.state||{};
              const remoteHasData=Object.keys(remoteState).length>0;
              if(hasLocalData()&&remoteHasData){promptSyncConflict(remoteState);}
              else if(remoteHasData){applyCloudState(remoteState);showToast('pulled your saved data');checkWeeklyRecap();}
              else{pushToCloud();checkWeeklyRecap();}
            }else{pushToCloud();checkWeeklyRecap();}
            attachRealtimeListener(uid);
          }).catch(err=>{console.error(err);showToast('⚠ could not reach cloud sync');updateSyncStatusDot('error');checkWeeklyRecap();});
        });
      }
      function initCloudSync(){
        const rememberedEmail=loadRememberedEmail();
        const emailInput=document.getElementById('syncEmailInput');
        if(rememberedEmail&&emailInput)emailInput.value=rememberedEmail;
        setTimeout(checkWeeklyRecap,6000);
        onFirebaseReady(()=>{
          window.fb.onAuthStateChanged(window.fb.auth,applyAuthenticatedUser);
        });
      }

      function refreshAllUI(){
        if(!selectedHabitForGraph&&bgHabits.length>0){let best=bgHabits[0];bgHabits.forEach(h=>{if(Object.keys(h.history).length>Object.keys(best.history).length)best=h;});selectedHabitForGraph=best.id;}
        renderHabitGraphList();switchPanel(activePanel);switchTodayHubTab(todayHubTab);updateNotificationSettingUI();updateSessionNoteUI();updateDisplay();updateStatus();updateChainTotals();updateLevelDisplay();updateDashboard();updateStats();renderTasks();renderLibrary();renderBgHabits();renderSessionLog();drawFocusChart();drawHeatmap();drawHabitCheckGraph();updateTaskNotesSection();restoreNotepadState();updateAdaptiveGoalUI();renderGoals();applyViewMode();updateSettingsPlanningUI();
        if(!soundEnabled){soundToggle.classList.add('muted');soundToggle.textContent='🔕';}else{soundToggle.classList.remove('muted');soundToggle.textContent='🔔';}
      }
      function initialize(){loadData();if(!restoredActiveTimer){currentMode='pomodoro';timeLeftSeconds=chainActive?chainConfig.workMinutes*60:25*60;isRunning=false;}if(timerInterval)clearInterval(timerInterval);if(isRunning)timerInterval=setInterval(tickTimer,1000);refreshAllUI();installContextHelp();setupCollapsibleCards();setupQuickJump();applyRecurringTasks();initCloudSync();if(!hasSeenWelcome)openWelcome();}
      initialize();
      window.addEventListener('beforeunload',()=>{saveData();if(timerInterval)clearInterval(timerInterval);});
      window.addEventListener('resize',()=>{if(viewMode==='auto')applyViewMode();drawFocusChart();drawHeatmap();drawHabitCheckGraph();syncHabitGraphListHeight();if(activePanel==='recovery'){drawRecoveryChart();drawSleepDurationChart();}});
      setupIntervalsImport();
    })();
  </script>
